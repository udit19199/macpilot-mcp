[project]
name = "macpilot-mcp"
version = "0.1.0"
description = "Local MCP server for Apple Mail, Calendar, Reminders and Contacts on macOS with FTS5 mail search."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
authors = [{ name = "Udit Agarwal" }]
keywords = ["apple-mail", "mcp", "fts5", "macos", "calendar", "reminders", "contacts"]
dependencies = [
  "fastmcp>=3.0.0",
  "mcp>=2.1.1",
  "pydantic>=2.12",
  "beautifulsoup4>=4.12",
  "selectolax>=0.4.0",
]

[project.scripts]
macpilot-mcp = "macpilot_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macpilot_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["src/macpilot_mcp/vendor_imdinu", "src/macpilot_mcp/vendor_freyer", "src/macpilot_mcp/vendor_common", "src/macpilot_mcp/vendor_reed", "_vendor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
